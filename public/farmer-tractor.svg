<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" opacity="0.15">
  <!-- Tractor wheels -->
  <circle cx="80" cy="200" r="30" fill="#333" stroke="#555" stroke-width="2"/>
  <circle cx="200" cy="200" r="30" fill="#333" stroke="#555" stroke-width="2"/>
  <!-- Wheel details -->
  <circle cx="80" cy="200" r="25" fill="none" stroke="#555" stroke-width="1"/>
  <circle cx="200" cy="200" r="25" fill="none" stroke="#555" stroke-width="1"/>
  
  <!-- Tractor body -->
  <rect x="60" y="120" width="160" height="80" rx="10" fill="#D32F2F"/>
  <rect x="70" y="130" width="140" height="60" rx="8" fill="#E53935"/>
  
  <!-- Tractor cabin -->
  <rect x="170" y="80" width="40" height="50" rx="5" fill="#F5DEB3"/>
  <polygon points="170,80 210,80 200,60 180,60" fill="#87CEEB"/>
  
  <!-- Chimney/exhaust -->
  <rect x="185" y="50" width="8" height="30" fill="#555"/>
  <rect x="183" y="45" width="12" height="8" fill="#777"/>
  
  <!-- Steering wheel -->
  <circle cx="175" cy="105" r="8" fill="#333"/>
  <circle cx="175" cy="105" r="5" fill="none" stroke="#555" stroke-width="1"/>
  
  <!-- Tractor front -->
  <rect x="100" y="110" width="30" height="20" fill="#333"/>
  <rect x="100" y="105" width="30" height="10" rx="3" fill="#87CEEB"/>
  
  <!-- Farmer figure -->
  <circle cx="185" cy="70" r="8" fill="#FDBCB4"/>
  <!-- Hat -->
  <rect x="177" y="60" width="16" height="4" fill="#8B4513"/>
  <polygon points="181,60 189,60 185,55" fill="#A0522D"/>
  <!-- Arms -->
  <line x1="177" y1="78" x2="165" y2="85" stroke="#FDBCB4" stroke-width="3"/>
  <line x1="193" y1="78" x2="205" y2="85" stroke="#FDBCB4" stroke-width="3"/>
  <!-- Body -->
  <rect x="180" y="78" width="10" height="15" fill="#2E7D32"/>
  <!-- Legs -->
  <line x1="183" y1="93" x2="180" y2="110" stroke="#333" stroke-width="3"/>
  <line x1="187" y1="93" x2="190" y2="110" stroke="#333" stroke-width="3"/>
  
  <!-- Plow attachment on tractor -->
  <polygon points="60,130 40,160 50,165 70,135" fill="#555"/>
  <line x1="40" y1="160" x2="35" y2="180" stroke="#777" stroke-width="2"/>
  <line x1="50" y1="165" x2="48" y2="185" stroke="#777" stroke-width="2"/>
  
  <!-- Soil being tilled (waves) -->
  <path d="M 20 190 Q 25 185 30 190 T 40 190" stroke="#8B7355" stroke-width="2" fill="none"/>
  <path d="M 25 200 Q 30 195 35 200 T 45 200" stroke="#8B7355" stroke-width="2" fill="none"/>
  <path d="M 30 210 Q 35 205 40 210 T 50 210" stroke="#8B7355" stroke-width="2" fill="none"/>
</svg>