name: agrovision_app
description: AgroVision AI - Smart Crop Disease Detection Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.5.9

  # HTTP
  http: ^1.2.1

  # Image & Computer Vision
  image_picker: ^1.1.2
  flutter_image_compress: ^2.2.0
  image: ^4.2.0
  path: ^1.9.0

  # On-Device Machine Learning (TensorFlow Lite)
  tflite_flutter: ^0.12.1

  # State
  provider: ^6.1.2

  # Animations
  flutter_animate: ^4.5.0

  # Storage
  shared_preferences: ^2.3.2
  path_provider: ^2.1.3

  # Network
  connectivity_plus: ^6.0.3

  # Permissions
  permission_handler: ^11.3.1

  # UI
  shimmer: ^3.0.0
  intl: ^0.19.0
  flutter_dotenv: ^5.2.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/animations/
    - assets/models/
