services:
  - type: web
    name: agrovision-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LOG_LEVEL
        value: info
      - key: MODEL_PATH
        value: model/sub_models/crop_classifier.tflite
      - key: LABELS_PATH
        value: model/labels.json
      - key: IMAGE_SIZE
        value: "224"
      - key: CROP_CONFIDENCE_THRESHOLD
        value: "65.0"
      - key: DISEASE_CONFIDENCE_THRESHOLD
        value: "50.0"
    healthCheckPath: /health

